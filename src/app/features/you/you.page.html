<fit-page title="You">
  <fit-card class="profile">
    <div class="avatar" aria-hidden="true"><ion-icon name="person-circle-outline" /></div>
    <div>
      <h2 class="profile-title">Your profile</h2>
      <p class="profile-text">Profile details, goals and body stats will live here once accounts are set up.</p>
    </div>
  </fit-card>

  <section aria-labelledby="you-activity">
    <fit-section-header title="Activity" headingId="you-activity" />
    <fit-card padding="none">
      <button type="button" class="entry" data-testid="progress-entry" (click)="openProgress()">
        <span class="entry-icon" aria-hidden="true"><ion-icon name="trending-up" /></span>
        <span class="entry-text">
          <span class="entry-title">Progress</span>&ngsp;
          <span class="entry-description">Training activity and performance</span>
        </span>
        <ion-icon class="entry-chevron" name="chevron-forward" aria-hidden="true" />
      </button>
    </fit-card>
  </section>

  <section aria-labelledby="you-body">
    <fit-section-header title="Body" headingId="you-body" />
    <fit-card padding="none">
      <button type="button" class="entry" data-testid="weight-history-entry" (click)="openWeightHistory()">
        <span class="entry-icon" aria-hidden="true"><ion-icon name="scale-outline" /></span>
        <span class="entry-text">
          <span class="entry-title">Body weight</span>&ngsp;
          <span class="entry-description">Your recorded weigh-ins</span>
        </span>
        <ion-icon class="entry-chevron" name="chevron-forward" aria-hidden="true" />
      </button>
    </fit-card>
  </section>

  <section aria-labelledby="you-appearance">
    <fit-section-header title="Appearance" headingId="you-appearance" />
    <fit-card>
      <fit-segmented-control
        name="theme-preference"
        legend="Theme"
        [options]="themeOptions"
        [value]="theme.preference()"
        (valueChange)="theme.setPreference($event)"
      />
      <p class="hint">System follows your device's light or dark setting.</p>
    </fit-card>
  </section>

  <section aria-labelledby="you-settings">
    <fit-section-header title="Settings" headingId="you-settings" />
    <fit-card padding="none">
      <ul class="settings-list">
        @for (setting of upcomingSettings; track setting) {
          <li>
            <span>{{ setting }}</span>
            <fit-chip>Coming soon</fit-chip>
          </li>
        }
      </ul>
    </fit-card>
  </section>
</fit-page>
