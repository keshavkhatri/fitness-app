<fit-page title="You" customHeader>
  <header class="header" fitPageHeader>
    <div class="title-row">
      <h1 class="heading">You</h1>
      <button type="button" class="gear" aria-label="Settings" data-testid="settings-gear" (click)="openSettings()">
        <ion-icon name="settings-outline" aria-hidden="true" />
      </button>
    </div>
    <app-you-header [name]="identity.identity().name" [photo]="identity.identity().photo" [header]="header()" (edit)="openIdentity()" />
  </header>

  @if (goal(); as g) {
    <button type="button" class="goal" data-testid="goal-entry" (click)="openProfile()">
      <span class="goal-icon" aria-hidden="true"><ion-icon [name]="g.icon" /></span>
      <span class="goal-text">
        <span class="goal-label">{{ copy.goal }}</span>&ngsp;
        <span class="goal-title">{{ g.label }}</span>&ngsp;
        <span class="goal-description">{{ g.description }}</span>
      </span>
      <ion-icon class="chevron" name="chevron-forward" aria-hidden="true" />
    </button>
  }

  <nav class="tiles" [attr.aria-label]="copy.sections">
    @for (tile of tiles; track tile.id) {
      <button
        type="button"
        class="tile"
        [attr.data-testid]="testIds[tile.id]"
        [attr.aria-haspopup]="tile.dialog ? 'dialog' : null"
        (click)="openTile(tile.id)"
      >
        <span class="tile-icon" aria-hidden="true"><ion-icon [name]="tile.icon" /></span>
        <span class="tile-title">{{ tile.title }}</span>&ngsp;
        <span class="tile-description">{{ tile.description }}</span>
      </button>
    }
  </nav>


  <app-link-card icon="settings-outline" title="Settings" detail="Account, plan, units and appearance" data-testid="settings-entry" (open)="openSettings()" />

  <app-identity-sheet
    [(open)]="identityOpen"
    [identity]="identity.identity()"
    [saving]="identitySaving()"
    [saveError]="identityError()"
    (save)="saveIdentity($event)"
  />
</fit-page>
