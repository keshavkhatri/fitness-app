<ion-content>
  <header class="hero" role="banner">
    <img class="hero-photo" src="assets/images/onboarding/offer-hero.webp" alt="" aria-hidden="true" decoding="async" />
    <span class="hero-scrim" aria-hidden="true"></span>
    <app-offer-brand />
    <h1 class="title" data-testid="offer-title">{{ copy.title }}</h1>
    <p class="lead">{{ copy.lead }}</p>
  </header>

  <main class="body">
    <ul class="features" aria-label="What's included" data-testid="offer-features">
      @for (feature of copy.features; track feature.title) {
        <li class="feature">
          <span class="feature-icon" aria-hidden="true"><ion-icon [name]="feature.icon" /></span>
          <span>
            <span class="feature-title">{{ feature.title }}</span>
            <span class="feature-text">{{ feature.text }}</span>
          </span>
        </li>
      }
    </ul>
  </main>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer">
    <button fit-button type="button" size="lg" block variant="ink" [loading]="leaving()" [disabled]="leaving()" data-testid="offer-continue-free" (click)="continueFree()">
      {{ copy.continueFree }}
    </button>
  </div>
</ion-footer>
