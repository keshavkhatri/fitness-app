<fit-page title="Today">
  @if (summary.hasValue()) {
    @let s = summary.value();

    <header class="hero">
      <div class="hero-text">
        <p class="date">{{ today | date: 'EEEE, MMMM d' }}</p>
        <p class="greeting">{{ greeting }}, {{ s.user.firstName }}</p>
      </div>
      @if (isDemo) {
        <fit-chip icon="information-circle-outline">Demo data</fit-chip>
      }
    </header>

    <section aria-labelledby="home-goal">
      <fit-section-header title="Your goal" headingId="home-goal" />
      <app-goal-summary-card [goal]="s.goal" />
    </section>

    <section aria-labelledby="home-workout">
      <fit-section-header title="Today's workout" headingId="home-workout" />
      <app-today-workout-card [workout]="s.todayWorkout" />
    </section>

    <section aria-labelledby="home-nutrition">
      <fit-section-header title="Nutrition" headingId="home-nutrition" />
      <app-nutrition-summary-card [nutrition]="s.nutrition" />
    </section>

    <section aria-labelledby="home-progress">
      <fit-section-header title="Progress" headingId="home-progress" />
      <app-progress-summary-card [progress]="s.progress" />
    </section>
  } @else if (summary.error()) {
    <fit-card>
      <fit-empty-state
        icon="information-circle-outline"
        title="Couldn't load your summary"
        description="Something went wrong while loading today's overview."
      >
        <button fit-button type="button" variant="secondary" (click)="summary.reload()">Try again</button>
      </fit-empty-state>
    </fit-card>
  } @else {
    <div class="loading" aria-busy="true">
      <span class="visually-hidden" role="status">Loading your summary</span>
      <fit-skeleton width="40%" height="16px" />
      <fit-skeleton width="70%" height="28px" />
      <fit-skeleton height="140px" radius="card" />
      <fit-skeleton height="200px" radius="card" />
      <fit-skeleton height="240px" radius="card" />
    </div>
  }
</fit-page>
