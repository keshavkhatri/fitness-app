@let f = values();
@let e = errors();
<form [id]="formId()" class="form" novalidate data-testid="food-form" (submit)="$event.preventDefault(); submitted.emit()">
  <fit-text-field
    #nameField
    [label]="copy.name"
    [hint]="copy.namePlaceholderHint"
    [value]="f.name"
    [error]="e.name ?? null"
    [maxLength]="80"
    autocomplete="off"
    data-testid="field-name"
    (valueChange)="change('name', $event)"
  />

  <fit-text-field
    #quantityField
    [label]="copy.quantity"
    inputMode="decimal"
    [value]="f.quantity"
    [error]="e.quantity ?? null"
    data-testid="field-quantity"
    (valueChange)="change('quantity', $event)"
  />

  <div class="choice">
    <p class="choice-label" id="food-unit-label">{{ copy.unit }}</p>
    <fit-choice-group
      name="food-unit"
      labelledBy="food-unit-label"
      layout="chips"
      [options]="unitOptions"
      [selected]="[f.unit]"
      data-testid="field-unit"
      (optionToggled)="change('unit', $event)"
    />
  </div>

  <div class="choice">
    <p class="choice-label" id="food-meal-label">{{ copy.meal }}</p>
    <fit-choice-group
      name="food-meal"
      labelledBy="food-meal-label"
      layout="chips"
      [options]="mealOptions"
      [selected]="[f.meal]"
      data-testid="field-meal"
      (optionToggled)="change('meal', $event)"
    />
  </div>

  <fieldset class="values">
    <legend class="values-title">{{ copy.nutritionTitle }}</legend>
    <p class="values-hint">{{ copy.nutritionHint }}</p>
    <div class="grid">
      <fit-text-field
        #caloriesField
        [label]="copy.calories"
        suffix="kcal"
        inputMode="decimal"
        [value]="f.calories"
        [error]="e.calories ?? null"
        data-testid="field-calories"
        (valueChange)="change('calories', $event)"
      />
      <fit-text-field
        #proteinField
        [label]="copy.protein"
        suffix="g"
        inputMode="decimal"
        [value]="f.proteinGrams"
        [error]="e.proteinGrams ?? null"
        data-testid="field-protein"
        (valueChange)="change('proteinGrams', $event)"
      />
      <fit-text-field
        #carbsField
        [label]="copy.carbs"
        suffix="g"
        inputMode="decimal"
        [value]="f.carbohydrateGrams"
        [error]="e.carbohydrateGrams ?? null"
        data-testid="field-carbs"
        (valueChange)="change('carbohydrateGrams', $event)"
      />
      <fit-text-field
        #fatField
        [label]="copy.fat"
        suffix="g"
        inputMode="decimal"
        enterKeyHint="done"
        [value]="f.fatGrams"
        [error]="e.fatGrams ?? null"
        data-testid="field-fat"
        (valueChange)="change('fatGrams', $event)"
      />
    </div>
  </fieldset>
</form>
