<ion-tabs (ionTabsDidChange)="activeTab.set($event.tab)">
  <ion-tab-bar slot="bottom" class="fit-theme-dashboard">
    @for (item of tabBarItems; track item.id) {
      <ion-tab-button [tab]="item.id">
        <ion-icon [name]="activeTab() === item.id ? item.activeIcon : item.icon" aria-hidden="true" />
        <ion-label>{{ item.label }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>

<app-quick-add-sheet [actions]="quickAddActions" [(open)]="quickAddOpen" (actionSelected)="runQuickAdd($event)" />
