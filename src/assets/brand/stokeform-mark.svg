<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="StokeForm">
  <title>StokeForm</title>
  <!-- The StokeForm mark: an "S" (Stoke) with a spark (energy). Lime #C5F36B, the app's accent.
       scripts/generate-brand-assets.mjs reads the <g id="mark"> group below to build every icon, so edit it here
       and regenerate; the group's own transform centres the artwork on the 108 x 108 canvas. -->
  <g id="mark" transform="translate(-7 3)">
    <path d="M68 34C61 25 38 26 38 41C38 57 68 52 68 69C68 86 44 87 35 77" fill="none" stroke="#C5F36B" stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M83 15l3.2 8.3 8.3 3.2-8.3 3.2L83 38l-3.2-8.3-8.3-3.2 8.3-3.2z" fill="#C5F36B"/>
  </g>
</svg>
